    <script>
        function scrollStrip(direction) {
            const strip = document.querySelector('.location-strip');
            const scrollAmount = 200; 
            
            strip.scrollBy({
                left: direction * scrollAmount,
                behavior: 'smooth'
            });
        }

        function openDrawer(cityId, element) {
            const drawers = document.querySelectorAll('.drawer-wrapper');
            drawers.forEach(d => d.style.display = 'none');

            const target = document.getElementById(cityId);
            if (target) {
                target.style.display = 'block';
            }

            const covers = document.querySelectorAll('.location-cover');
            covers.forEach(c => c.classList.remove('active'));
            element.classList.add('active');
        }

        function scrollDrawer(wrapperId, direction) {
            const wrapper = document.getElementById(wrapperId);
            const scrollArea = wrapper.querySelector('.drawer-scroll');
            const firstItem = scrollArea.querySelector('.drawer-item');
            
            let scrollAmount = 600;

            if (firstItem) {
                scrollAmount = (firstItem.offsetWidth + 30) * 2;
            }
            
            scrollArea.scrollBy({
                left: direction * scrollAmount,
                behavior: 'smooth'
            });
        }
    </script>
